services:
  - type: web
    name: deerguard-ai-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: YOLO_DEVICE
        value: cpu
      - key: CAMERA_TYPE
        value: LOCAL_VIDEO
      - key: CAMERA_SOURCE
        value: videos/deer_test.mp4
